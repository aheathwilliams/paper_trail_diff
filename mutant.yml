# Mutation testing for the code that decides what counts as a change and which
# history is read. Mutant alters one expression at a time and expects at least
# one spec to fail; a mutation every spec still passes is a behavior nothing
# checks.
#
#   BUNDLE_GEMFILE=gemfiles/mutant.gemfile bundle exec mutant run
#
# Free `opensource` usage applies because this repository is public and MIT
# licensed.
usage: opensource
includes:
  - lib
requires:
  - paper_trail_diff
integration:
  name: rspec
  # The association suite: it loads PT-AT and reaches every path these subjects
  # are on, including activity timelines. Same files as `rake spec_associations`.
  arguments:
    - --exclude-pattern
    - spec/unit/loading_spec.rb
    - spec/unit
    - spec/association
environment_variables:
  PAPER_TRAIL_DIFF_MUTANT: "1"
  PAPER_TRAIL_DIFF_DATABASE_URL: sqlite3:tmp/mutant/base.sqlite3
# Mutant counts a timeout as a kill. A mutation no spec catches runs every
# selected spec, so the limit must exceed that (the whole association suite
# takes about 20 seconds), or a surviving mutation is reported as caught.
mutation:
  timeout: 60.0
hooks:
  - spec/support/mutant_hooks.rb
matcher:
  subjects:
    - PaperTrailDiff::Engine*
    - PaperTrailDiff::CollectionComparator*
    - PaperTrailDiff::CollectionIdentityIndex*
    - PaperTrailDiff::NestedComparator*
    - PaperTrailDiff::SnapshotNormalizer*
    - PaperTrailDiff::SnapshotPool*
    - PaperTrailDiff::TimelineRange*
    - PaperTrailDiff::RootVersionPlan*
    - PaperTrailDiff::HistoricalFilter*
    - PaperTrailDiff::TimeRange*
    - PaperTrailDiff::VersionRange*
    - PaperTrailDiff::TimeVersionRange*
    - PaperTrailDiff::BatchedRootVersions*
    - PaperTrailDiff::DeletedAnalysisBatch*
    - PaperTrailDiff::RecordedChanges*
