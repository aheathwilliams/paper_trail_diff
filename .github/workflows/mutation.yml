name: Mutation

# The full mutation run (see mutant.yml) takes too long for every push, and the
# CI workflow cancels a run when a newer push arrives. It runs nightly instead,
# only when main has a commit that has not passed yet. Pull requests still
# mutate the methods they change, in ci.yml.
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

concurrency:
  group: mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check for untested changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}

    steps:
      # A run skipped for this reason also succeeds, so one real pass covers
      # every later night until main moves. A failed night runs again.
      - name: Look for a passing run of this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutation.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          echo "tested=$([ "$passed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutation testing
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      BUNDLE_GEMFILE: gemfiles/mutant.gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Mutate every configured subject
        run: bundle exec mutant run
