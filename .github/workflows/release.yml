name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish gem
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Verify tag matches gem version
        shell: bash
        run: |
          ruby -Ilib -rpaper_trail_diff/version -e \
            'abort "tag must be v#{PaperTrailDiff::VERSION}" unless ENV.fetch("GITHUB_REF_NAME") == "v#{PaperTrailDiff::VERSION}"'

      - name: Run quality checks
        run: bundle exec rake

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1
