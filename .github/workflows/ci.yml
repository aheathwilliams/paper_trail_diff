name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every other job runs against a generated gemfile rather than the Gemfile,
  # so a dependency changed only in the Gemfile is one CI never installs. This
  # job is the only one that uses the Gemfile itself, which is what lets it
  # notice.
  gemfiles:
    name: Appraisal gemfiles in sync
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify the generated gemfiles match the Gemfile
        run: bundle exec rake verify_gemfiles

  quality:
    name: Ruby ${{ matrix.ruby }} / PaperTrail ${{ matrix.paper_trail }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.1'
            paper_trail: '16'
            gemfile: paper_trail_16
          - ruby: '3.2'
            paper_trail: '17'
            gemfile: paper_trail_17
          - ruby: '3.3'
            paper_trail: '17'
            gemfile: paper_trail_17
          - ruby: '3.4'
            paper_trail: '17'
            gemfile: paper_trail_17
          - ruby: '4.0'
            paper_trail: '16'
            gemfile: paper_trail_16
          - ruby: '4.0'
            paper_trail: '17'
            gemfile: paper_trail_17

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs, linting, and type checking
        run: bundle exec rake

  # PaperTrail writes YAML history unless told otherwise, and so does every
  # other job. This one runs the suites with its JSON serializer. The
  # PaperTrail 16 bundle's Active Support 8.0 cannot encode JSON with json 3.
  json:
    name: JSON history / Ruby 4.0 / PaperTrail 17
    runs-on: ubuntu-latest

    env:
      BUNDLE_GEMFILE: gemfiles/paper_trail_17.gemfile
      PAPER_TRAIL_DIFF_SERIALIZER: json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run specs with JSON history
        run: bundle exec rake spec

  databases:
    name: ${{ matrix.database }} / Ruby 4.0 / PaperTrail 17
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL 17
            image: postgres:17
            port: 5432
            url: postgresql://paper_trail_diff:test@127.0.0.1:5432/paper_trail_diff_test
            health: pg_isready -U paper_trail_diff -d paper_trail_diff_test
          - database: MySQL 8.4
            image: mysql:8.4
            port: 3306
            url: mysql2://paper_trail_diff:test@127.0.0.1:3306/paper_trail_diff_test
            health: mysqladmin ping -h 127.0.0.1 -ptest
          - database: SQL Server 2019
            image: mcr.microsoft.com/mssql/server:2019-latest
            port: 1433
            url: sqlserver://sa:PaperTrail_Test2026@127.0.0.1:1433/paper_trail_diff_test
            health: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P PaperTrail_Test2026 -C -Q 'SELECT 1' -b
            setup: CREATE DATABASE paper_trail_diff_test
          # Each call reads in one SNAPSHOT transaction where the database
          # allows it, so one SQL Server job allows it and the other does not.
          - database: SQL Server 2022 with snapshot isolation
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            url: sqlserver://sa:PaperTrail_Test2026@127.0.0.1:1433/paper_trail_diff_test
            health: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P PaperTrail_Test2026 -C -Q 'SELECT 1' -b
            setup: >-
              CREATE DATABASE paper_trail_diff_test;
              ALTER DATABASE paper_trail_diff_test SET ALLOW_SNAPSHOT_ISOLATION ON

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: paper_trail_diff
          POSTGRES_PASSWORD: test
          POSTGRES_DB: paper_trail_diff_test
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: paper_trail_diff_test
          MYSQL_USER: paper_trail_diff
          MYSQL_PASSWORD: test
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: PaperTrail_Test2026
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      BUNDLE_GEMFILE: gemfiles/paper_trail_17.gemfile
      BUNDLE_WITH: database_adapters
      PAPER_TRAIL_DIFF_DATABASE_URL: ${{ matrix.url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install database client libraries
        run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev freetds-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Create SQL Server test database
        if: startsWith(matrix.database, 'SQL Server')
        run: >-
          docker exec ${{ job.services.database.id }}
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P PaperTrail_Test2026
          -C -Q '${{ matrix.setup }}' -b

      - name: Run core and association suites
        run: bundle exec rake spec

  windows:
    name: Windows Ruby ${{ matrix.ruby }} / PaperTrail ${{ matrix.paper_trail }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.1'
            paper_trail: '16'
            gemfile: paper_trail_16
          - ruby: '4.0'
            paper_trail: '17'
            gemfile: paper_trail_17

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs, linting, and type checking
        run: bundle exec rake

  build:
    name: Package Ruby ${{ matrix.ruby }} / PaperTrail ${{ matrix.paper_trail }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.1'
            paper_trail: '16'
            gemfile: paper_trail_16
          - ruby: '4.0'
            paper_trail: '17'
            gemfile: paper_trail_17

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build gem
        run: bundle exec rake build

      - name: Install and smoke-test without association tracking
        shell: bash
        run: |
          gem install --no-document pkg/paper_trail_diff-*.gem
          ruby -e 'require "paper_trail_diff"; abort if defined?(PaperTrailAssociationTracking)'

      - name: Validate packaged RBS signatures
        shell: bash
        run: |
          signature_dir=$(ruby -e 'spec = Gem::Specification.find_by_name("paper_trail_diff"); print File.join(spec.full_gem_path, "sig/generated")')
          bundle exec rbs -I "$signature_dir" validate

  # Mutation testing of the methods a pull request changes (see mutant.yml).
  # Mutant needs Ruby 3.3+, so it has its own bundle. The full set runs nightly
  # in mutation.yml, where a newer push cannot cancel it. The methods are split
  # across jobs (see script/mutant_shard.rb): one runner took over half an hour
  # for a pull request that changed 84 of them.
  mutation:
    name: Mutation testing (${{ matrix.shard }}/4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      BUNDLE_GEMFILE: gemfiles/mutant.gemfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Mutate this shard of the subjects this pull request touches
        run: ruby script/mutant_shard.rb "$(( ${{ matrix.shard }} - 1 ))" 4 "origin/${{ github.base_ref }}"
